# Purrfolio — saúde da gata (github.com/ricardowth/purrfolio)
# Não tem login: ouve só em 127.0.0.1 e chega-se lá apenas pelo `tailscale serve`.

APP=purrfolio
REPO=git@github.com:ricardowth/purrfolio.git
BRANCH=main
PORT=5174

# O build já corre o `tsc -b` (typecheck); não há testes automáticos
BUILD_CMD="npm ci && npm run build"
TEST_CMD="true"
START_CMD="/usr/bin/node server/index.js"
HEALTH_PATH=/api/health

# A app não cifra os backups: vai a pasta de dados inteira (data.json, fotos/documentos e snapshots)
# por um remote "crypt" do rclone, que cifra antes de enviar. Ver docs/proxmox.md (Purrfolio).
BACKUP_DIR=/srv/purrfolio/data
RCLONE_DEST=purrfolio-cifrado:

# Cria o .env partilhado por todas as versões (só na primeira instalação)
criar_env() {
  local bpw
  read -rsp "Password para cifrar os backups (guardar num gestor de passwords!): " bpw; echo
  cat <<EOF
DATA_DIR=/srv/$APP/data
HOST=127.0.0.1
PORT=$PORT
BACKUP_PASSWORD=$bpw
EOF
}
