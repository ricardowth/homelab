# Finanças pessoais (github.com/ricardowth/personal-finance)
# Lido pelos scripts em ../scripts — um ficheiro destes por app.

APP=financas
REPO=git@github.com:ricardowth/personal-finance.git
BRANCH=main
PORT=3000

# Corre em cada versão nova, por esta ordem; se algum falhar, a versão atual continua a correr
BUILD_CMD="npm ci && npm run build"
TEST_CMD="npm test"
# A partir da raiz da versão (o .env é lido daí)
START_CMD="/usr/bin/node server/dist/index.js"
# Responde 200 sem login: usado para confirmar que a versão nova arrancou
HEALTH_PATH=/api/sessao

# Pasta onde a app grava o backup automático (configurar em Definições → Backup automático)
BACKUP_DIR=/srv/financas/backups
# Destino no Google Drive (remote "gdrive" do rclone); os ficheiros já vão cifrados pela app (BACKUP_PASSWORD)
RCLONE_DEST=gdrive:Backups/Financas-servidor

# Cria o .env partilhado por todas as versões (só na primeira instalação)
criar_env() {
  local pw bpw
  read -rsp "Password de acesso à app: " pw; echo
  read -rsp "Password para cifrar os backups: " bpw; echo
  cat <<EOF
APP_PASSWORD=$pw
SESSION_SECRET=$(openssl rand -hex 32)
DATA_DIR=/srv/$APP/data
PORT=$PORT
COOKIE_SECURE=true
BACKUP_PASSWORD=$bpw
EOF
}
